name: Collect sheriff sales

on:
  workflow_dispatch:
  schedule:
    # Sheriff offices refresh their listings overnight; 11:23 UTC is early morning in New Jersey.
    - cron: "23 11 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test the parsers
        run: python -m pytest -q
      - name: Collect
        run: njss collect --data-dir data --counties config/counties.json
      - name: Commit changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "njss bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          git commit -m "Collect sheriff sales $(TZ=America/New_York date +%Y-%m-%d)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open or update a failure alert
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sheriff sale collection needs attention"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Failed again: ${run_url}"
          else
            gh issue create --title "$title" --body "The scheduled collection failed: ${run_url}"
          fi

      - name: Close the failure alert after recovery
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sheriff sale collection needs attention"
          issue="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Collection recovered."
          fi
